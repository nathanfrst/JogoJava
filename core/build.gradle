[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Standalone Java checks require no testing framework or graphics context.
sourceSets {
  worldCheck {
    compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
    runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
  }
}
tasks.register('checkWorldLayout', JavaExec) {
  dependsOn worldCheckClasses
  classpath = sourceSets.worldCheck.runtimeClasspath
  mainClass = 'io.github.projeto.WorldLayoutTest'
}
check.dependsOn checkWorldLayout
